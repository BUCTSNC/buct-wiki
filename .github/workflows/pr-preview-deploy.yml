name: PR preview deploy

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
  workflow_run:
    workflows: [PR preview build]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  deployments: write

concurrency:
  group: preview-deploy-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.repository == 'BUCTSNC/buct-wiki' || github.repository == 'BUCTSNC/buct-wiki-content') &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # workflow_run uses the default branch, never the pull request checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: BUCTSNC/buct-wiki
          ref: ${{ github.repository == 'BUCTSNC/buct-wiki' && github.sha || 'main' }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: trusted/package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: trusted/package.json
      - name: Check current pull request
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { findPullRequest, previewPrefix } = require('./trusted/scripts/preview-deploy.cjs');
            const pr = await findPullRequest(github, context);
            if (pr) {
              core.setOutput('number', pr.number);
              core.setOutput('sha', pr.head.sha);
              core.setOutput('branch', `${previewPrefix(context.payload.repository.full_name)}${pr.number}`);
            } else {
              core.notice('No open PR matches this build; skipping deployment.');
            }
      - name: Start preview deployment
        id: tracking
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
        with:
          script: |
            const { startPreview } = require('./trusted/scripts/preview-deploy.cjs');
            await startPreview(github, context, core, {
              number: Number(process.env.PR_NUMBER), head: { sha: process.env.PR_SHA },
            });
      - run: pnpm install --dev --frozen-lockfile
        working-directory: trusted
        if: steps.pr.outputs.number != '' && github.event.workflow_run.conclusion == 'success'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.pr.outputs.number != '' && github.event.workflow_run.conclusion == 'success'
        with:
          name: pr-preview
          path: preview-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Prepare static assets
        if: steps.pr.outputs.number != '' && github.event.workflow_run.conclusion == 'success'
        run: node trusted/scripts/preview-deploy.cjs preview-artifact trusted/dist
      - name: Deploy preview
        if: steps.pr.outputs.number != '' && github.event.workflow_run.conclusion == 'success'
        id: deploy
        working-directory: trusted
        run: >-
          pnpm exec wrangler preview
          --name "$PREVIEW_NAME" --tag "$PR_SHA" --ignore-base-config
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/preview-result.ndjson
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: ${{ steps.pr.outputs.branch }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
      - name: Report preview result
        if: always() && steps.tracking.outputs.id != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOYMENT_ID: ${{ steps.tracking.outputs.id }}
          DEPLOY_SUCCEEDED: ${{ steps.deploy.outcome == 'success' }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
        with:
          script: |
            const { finishPreview, previewUrls } = require('./trusted/scripts/preview-deploy.cjs');
            let urls = {};
            if (process.env.DEPLOY_SUCCEEDED === 'true') {
              const { readFileSync } = require('node:fs');
              const { join } = require('node:path');
              try { urls = previewUrls(readFileSync(join(process.env.RUNNER_TEMP, 'preview-result.ndjson'), 'utf8')); }
              catch (error) { core.setFailed(error.message); }
            }
            await finishPreview(github, context, {
              deploymentId: Number(process.env.DEPLOYMENT_ID),
              number: Number(process.env.PR_NUMBER), sha: process.env.PR_SHA,
              ...urls,
            });
