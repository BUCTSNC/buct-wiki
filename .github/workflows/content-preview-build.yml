name: Content PR preview build

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: content-preview-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: ./.github/workflows/build.yml
    with:
      content-only: true
      artifact-name: ${{ github.event_name == 'pull_request' && 'pr-preview' || '' }}
